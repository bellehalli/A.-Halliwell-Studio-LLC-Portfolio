<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halliwell · Motion study</title><link rel="stylesheet" href="motion.css">
<style>*{box-sizing:border-box}body{margin:0;background:#f5c8d8;font:18px/1.5 Arial,sans-serif;color:#261b20;padding:clamp(20px,5vw,70px)}h1{font-size:clamp(36px,6vw,72px);letter-spacing:-.05em;line-height:1}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}figure{margin:0;background:#fffcee;border:1px solid #261b20;border-radius:24px;padding:30px;text-align:center;overflow:hidden}img{width:100%;max-width:280px;aspect-ratio:1;object-fit:contain}button{padding:14px 24px;border:1px solid;border-radius:40px;background:#fffcee;font:inherit;cursor:pointer;margin:0 0 30px}figcaption{margin-top:20px}p{max-width:650px}</style>
<h1>A little movement.<br>A lot of personality.</h1><p>Three motion studies for A. Halliwell Studio. These are separate transparent PNG assets, animated with CSS.</p><button id="pause" aria-pressed="false">Pause motion</button><main><figure><img class="flower-motion" src="assets/flower-icon.png" alt="Raspberry Y2K flower"><figcaption>Slow flower rotation</figcaption></figure><figure><img class="heart-motion" src="assets/jelly-heart.png" alt="Glossy blush jelly heart"><figcaption>Gentle heartbeat</figcaption></figure><figure><img class="sparkle-motion" src="assets/sparkle.png" alt="Raspberry four-point sparkle"><figcaption>Soft sparkle twinkle</figcaption></figure></main><p>Reduced-motion preferences are respected automatically. No changes to your live portfolio.</p><script>document.getElementById('pause').onclick=function(){const p=document.body.classList.toggle('paused');this.setAttribute('aria-pressed',String(p));this.textContent=p?'Resume motion':'Pause motion';};</script></html>
